<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#64748b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:34px;font-weight:bold;fill:white}.label{font-size:22px;font-weight:bold}.body{font-size:18px}.small{font-size:16px;fill:#475569}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><rect width="1440" height="1080" fill="#f1f5f9"/><rect width="1440" height="110" fill="#17324d"/><text x="40" y="50" class="title">SecurePT Cloud | Security Infrastructure Lab</text><text x="40" y="84" style="fill:#dbeafe;font-size:19px">AWS us-east-1 • single-zone lab • architecture and Phase 5 evidence</text><rect x="40" y="140" width="910" height="760" rx="14" fill="#e8f2f8" stroke="#cbd5e1"/><text x="58" y="172" class="label">VPC 10.20.0.0/16 | us-east-1a</text><rect x="70" y="205" width="390" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="88" y="237" class="label">Internet gateway</text><text x="88" y="268" class="body">Attached to VPC</text><text x="88" y="294" class="body">Public subnet route: 0.0.0.0/0 → IGW</text><rect x="70" y="345" width="390" height="390" rx="14" fill="#fff7ed" stroke="#cbd5e1"/><text x="88" y="377" class="label">Public subnet | 10.20.1.0/24</text><rect x="90" y="410" width="350" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="108" y="442" class="label">Public route table</text><text x="108" y="473" class="body">10.20.0.0/16 → local</text><text x="108" y="499" class="body">0.0.0.0/0 → internet gateway</text><rect x="90" y="555" width="350" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="108" y="587" class="label">Web-tier security group</text><text x="108" y="618" class="body">Inbound IPv4 TCP 80 / 443</text><text x="108" y="644" class="body">No web server deployed</text><text x="108" y="670" class="body">No load balancer deployed</text><rect x="490" y="205" width="430" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="508" y="237" class="label">Internet routing context</text><text x="508" y="268" class="body">Public subnet has an IGW route.</text><text x="508" y="294" class="body">Private backend has no direct path.</text><rect x="490" y="345" width="430" height="390" rx="14" fill="#edf8f1" stroke="#cbd5e1"/><text x="508" y="377" class="label">Private subnet | 10.20.10.0/24</text><rect x="510" y="410" width="390" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="528" y="442" class="label">Private route table</text><text x="528" y="473" class="body">10.20.0.0/16 → local only</text><text x="528" y="499" class="body">No default route / NAT path</text><rect x="510" y="555" width="390" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="528" y="587" class="label">Private Ubuntu backend</text><text x="528" y="618" class="body">No public IP • IMDSv2 required</text><text x="528" y="644" class="body">TCP 443 / 5432 from web SG only</text><text x="528" y="670" class="body">Encrypted root disk: 8 GiB gp3</text><path class="line" stroke-dasharray="6 5" d="M440 630 H510"/><text x="70" y="785" class="small">Dashed line: permitted security group source relationship.</text><text x="70" y="813" class="small">No application or database service is installed by this Terraform.</text><text x="70" y="841" class="small">Both security groups allow outbound IPv4 traffic, subject to routing.</text><text x="70" y="869" class="small">AWS-created main route table omitted; subnet associations are explicit.</text><rect x="980" y="140" width="420" height="760" rx="14" fill="#f1edfa" stroke="#cbd5e1"/><text x="998" y="172" class="label">Security logging</text><rect x="1000" y="205" width="380" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="1018" y="237" class="label">CloudTrail → S3</text><text x="1018" y="268" class="body">Single-region trail; global events</text><text x="1018" y="294" class="body">S3 public access blocked</text><text x="1018" y="320" class="body">AES256 encryption and versioning</text><rect x="1000" y="410" width="380" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="1018" y="442" class="label">VPC Flow Logs</text><text x="1018" y="473" class="body">VPC-wide ALL traffic types</text><text x="1018" y="499" class="body">IAM role authorizes delivery</text><path class="line" d="M1190 530 V565"/><rect x="1000" y="565" width="380" height="135" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="1018" y="597" class="label">CloudWatch Logs</text><text x="1018" y="628" class="body">Flow Logs destination</text><text x="1018" y="654" class="body">Seven-day retention for this lab</text><text x="1018" y="680" class="body">Delivery status verified</text><text x="1005" y="785" class="small">CloudTrail records AWS API activity.</text><text x="1005" y="813" class="small">Flow Logs record traffic metadata.</text><text x="1005" y="841" class="small">Application auditing and automatic</text><text x="1005" y="869" class="small">response are outside this MVP.</text><rect x="40" y="935" width="1360" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="58" y="967" class="label">Scope and evidence</text><text x="58" y="998" class="body">Derived from Terraform and AWS Console observations; captured October 15, 2026.</text><text x="58" y="1024" class="body">Demonstrates infrastructure controls; does not assert application functionality or compliance certification.</text></svg>